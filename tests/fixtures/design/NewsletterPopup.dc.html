<x-dc>
<helmet>
	<title>NewsletterPopup</title>
	<link rel="stylesheet" href="styles.css">
</helmet>
<div class="popup" role="dialog" aria-labelledby="popup-title">
	<h2 id="popup-title">Get the monthly note</h2>
	<p>One email a month. Unsubscribe with one click.</p>
	<form action="#" method="post">
		<label for="popup-email">Email</label>
		<input id="popup-email" name="email" type="email">
		<button type="submit" class="button">Subscribe</button>
	</form>
</div>
</x-dc>
